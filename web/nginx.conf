server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # SPA 라우팅: 모든 경로를 index.html 로
  location / {
    try_files $uri $uri/ /index.html;
  }

  # API 요청은 백엔드 서버로 전달
  location /api/ {
    proxy_pass http://server:4000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    client_max_body_size 100m;   # 사진/동영상 업로드 대비
  }
}
