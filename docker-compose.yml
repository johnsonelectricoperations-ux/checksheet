# 사내 PC 1대에서 서버+웹을 함께 실행하기 위한 구성 (0단계 골격)
# 운영 빌드는 단계가 진행되면서 보강한다.
services:
  server:
    build: ./server
    # 외부로 포트를 노출하지 않고 nginx(HTTPS) 를 통해서만 접근 → 평문 HTTP API 차단
    expose:
      - "5008"
    environment:
      - PORT=5008
      - DATA_DIR=/data
    volumes:
      - checksheet-data:/data   # DB와 미디어 파일을 영구 보관
    restart: unless-stopped

  web:
    build: ./web
    ports:
      - "8080:80"    # HTTP → HTTPS 리다이렉트
      - "8443:443"   # HTTPS (서비스워커/오프라인 동작에 필요)
    volumes:
      - ./certs:/etc/nginx/certs:ro   # generate-cert.sh 로 만든 인증서
    depends_on:
      - server
    restart: unless-stopped

volumes:
  checksheet-data:
