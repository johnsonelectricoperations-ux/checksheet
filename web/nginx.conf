# HTTP: HTTPS 로 리다이렉트 (서비스워커/오프라인은 HTTPS 필요)
server {
  listen 80;
  server_name _;
  return 301 https://$host:8443$request_uri;
}

# HTTPS: 실제 서비스
server {
  listen 443 ssl;
  server_name _;

  ssl_certificate     /etc/nginx/certs/server.crt;
  ssl_certificate_key /etc/nginx/certs/server.key;

  root /usr/share/nginx/html;
  index index.html;

  # SPA 라우팅: 모든 경로를 index.html 로
  location / {
    try_files $uri $uri/ /index.html;
  }

  # API 요청은 백엔드 서버로 전달
  location /api/ {
    proxy_pass http://server:5008;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    client_max_body_size 200m;   # 사진/동영상 업로드 대비
  }
}
